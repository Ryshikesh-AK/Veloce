<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/pwa-192x192.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#111827" />
    <meta name="description" content="Veloce — Luxury Car Marketplace PWA" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="apple-touch-icon" href="/pwa-192x192.svg" />
    <title>Veloce — Luxury Car Marketplace</title>

    <!-- Google Fonts: Inter & Newsreader for editorial luxury styling -->
    <link rel="preconnect" href="https://fonts.googleapis.com"/>
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin=""/>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&amp;family=Newsreader:ital,opsz,wght@1,6..72,400;1,6..72,500;1,6..72,600&amp;display=swap" rel="stylesheet"/>

    <!-- Tailwind CSS CDN with forms & container queries plugins -->
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>

    <!-- Tailwind Custom Configuration -->
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              brand: {
                green: '#22c55e',
                'green-dark': '#16a34a',
                lime: '#84cc16',
                charcoal: '#111827',
                surface: '#F8FAFC',
                card: '#FFFFFF',
                border: '#E2E8F0',
              }
            },
            fontFamily: {
              sans: ['Inter', 'system-ui', 'sans-serif'],
              serif: ['Newsreader', 'Georgia', 'serif'],
            },
            boxShadow: {
              'subtle': '0 2px 12px -2px rgba(0, 0, 0, 0.05), 0 1px 3px 0 rgba(0, 0, 0, 0.03)',
              'float': '0 20px 40px -15px rgba(0, 0, 0, 0.08), 0 0 1px 1px rgba(0,0,0,0.04)',
            }
          }
        }
      }
    </script>

    <!-- Custom CSS for layout, scrollbar & safe area handling -->
    <style>
      html {
        scroll-behavior: smooth;
        background-color: #020617;
      }
      body {
        -webkit-tap-highlight-color: transparent;
        font-feature-settings: 'cv02', 'cv03', 'cv04', 'cv11';
        background-color: #020617;
      }
      
      .no-scrollbar::-webkit-scrollbar {
        display: none;
      }
      .no-scrollbar {
        -ms-overflow-style: none;
        scrollbar-width: none;
      }

      .hero-glass-overlay {
        background: linear-gradient(180deg, rgba(15, 23, 42, 0.3) 0%, rgba(15, 23, 42, 0.9) 70%, #020617 100%);
      }

      .safe-bottom {
        padding-bottom: env(safe-area-inset-bottom, 24px);
      }
      .safe-top {
        padding-top: env(safe-area-inset-top, 12px);
      }
    </style>
  </head>
  <body class="bg-slate-950 text-slate-100 font-sans antialiased min-h-screen flex justify-center selection:bg-emerald-500 selection:text-white">
    <div id="root" class="w-full flex justify-center bg-slate-950"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
